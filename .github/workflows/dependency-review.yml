name: Dependency Review

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review introduced dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime,development,unknown
          license-check: false
          vulnerability-check: true
          # Exact, time-bounded development-only exception. The OSV policy,
          # ownership, installed path, and 2026-08-29 expiry are enforced by
          # scripts/security-workflow-policy.test.ts.
          allow-ghsas: GHSA-mh99-v99m-4gvg
          comment-summary-in-pr: never
          show-patched-versions: true
